name: Refresh locked snapshots

on:
  push:
    branches:
      - cursor/three-services-nav-26d6
    paths:
      - ".github/workflows/decode-locked-snapshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decode-locked-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Mark git directory safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Apply docs
        run: |
          if [ -f tmp/apply-docs.py ]; then
            python3 tmp/apply-docs.py
          else
            echo apply-docs.py missing; skip docs
          fi

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh locked snapshots
        env:
          CI: "true"
          NEXT_PUBLIC_ELEVENLABS_WIDGET_DISABLED: "true"
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("playwright.locked.config.ts")
          text = p.read_text()
          if "maxDiffPixelRatio: 0.05" not in text:
              raise SystemExit("expected maxDiffPixelRatio: 0.05")
          p.write_text(text.replace("maxDiffPixelRatio: 0.05", "maxDiffPixelRatio: 0"))
          PY
          pnpm test:visual:locked:update
          git checkout -- playwright.locked.config.ts

      - name: Commit docs and snapshots
        run: |
          set -euo pipefail
          git config user.name enzo
          git config user.email enzo@design-prism.com
          git rm -r --ignore-unmatch tmp
          git add AGENTS.md README.md DESIGN.md docs __tests__/visual/locked-routes.spec.ts-snapshots
          if git diff --staged --quiet; then
            echo No changes to commit
          else
            git commit -m "Apply service IA docs and refresh locked UI snapshots."
            git push origin HEAD:cursor/three-services-nav-26d6
          fi
